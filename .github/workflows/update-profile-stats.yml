name: Refresh profile stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "profile/**"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Gopal2006/Gopal2006'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Gopal2006&show_icons=true&include_all_commits=true&hide_border=true&bg_color=101114&title_color=D9878D&text_color=E9E7E5&icon_color=A84450&ring_color=A84450
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Gopal2006&layout=compact&langs_count=8&hide_border=true&bg_color=101114&title_color=D9878D&text_color=E9E7E5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit refreshed cards when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Stats cards are unchanged."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
