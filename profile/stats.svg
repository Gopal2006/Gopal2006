<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics setup card</title>
  <desc id="desc">This card will be replaced with GitHub statistics after the profile workflow runs successfully.</desc>
  <rect width="495" height="190" rx="12" fill="#101114" stroke="#353238"/><rect x="0" y="0" width="4" height="190" rx="2" fill="#A84450"/>
  <text x="26" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#D9878D">GITHUB / STATS</text>
  <text x="26" y="77" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#E9E7E5">Stats will appear after the first refresh.</text>
  <text x="26" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B7B2B4">Publish the bundle, then run the</text>
  <text x="26" y="121" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B7B2B4">“Refresh profile stats” workflow.</text>
  <path d="M26 151 H469" stroke="#A84450" stroke-opacity=".6"/><text x="26" y="173" font-family="monospace, Courier New" font-size="10" letter-spacing="1" fill="#8D8585">GOPAL2006 / GITHUB ACTIVITY</text>
</svg>
