      <circle cx="180" cy="128" r="82" stroke="#A84450" stroke-opacity="0.38"/>
      <circle cx="180" cy="128" r="48" stroke="#E9E7E5" stroke-opacity="0.12"/>
      <path d="M36 190H105L143 151H214L260 98H330" stroke="#A84450" stroke-opacity="0.72" stroke-width="1.4"/>
      <path d="M84 59H128L158 88H223L253 57H305" stroke="#E9E7E5" stroke-opacity="0.24"/>
      <path d="M73 218H125L158 185H215L249 219H311" stroke="#E9E7E5" stroke-opacity="0.16"/>
      <g fill="#D9878D" stroke="#101114" stroke-width="4"><circle cx="105" cy="190" r="4"/><circle cx="214" cy="151" r="4"/><circle cx="260" cy="98" r="4"/><circle cx="158" cy="88" r="3"/><circle cx="249" cy="219" r="3"/></g>
      <g fill="#C4BAB9" font-family="monospace, 'Courier New'" font-size="10" letter-spacing="1.4" opacity="0.58"><text x="34" y="28">READ SOURCE</text><text x="235" y="252">TRACE FLOW</text><text x="17" y="244">TEST / FIX</text></g>
    </g>
    <g transform="translate(68 47)">
      <rect width="186" height="28" rx="14" fill="#A84450" fill-opacity="0.14" stroke="#D9878D" stroke-opacity="0.38"/>
      <circle cx="15" cy="14" r="3.5" fill="#D9878D"/>
      <text x="28" y="18.5" fill="#E6C7C8" font-family="monospace, 'Courier New'" font-size="11" letter-spacing="1.3">CSE / WEB / SYSTEMS</text>
      <text x="-2" y="117" fill="#F1EFED" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="760" letter-spacing="-3">Gopal</text>
      <rect x="0" y="135" width="128" height="4" rx="2" fill="url(#edge)"/>
      <text x="0" y="177" fill="#D9878D" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600">I build software.</text>
      <text x="0" y="207" fill="#D5D0D0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18">I like figuring out how it works.</text>
      <text x="0" y="284" fill="#A8A3A4" font-family="monospace, 'Courier New'" font-size="12" letter-spacing="1.1">IIIT KOTA  /  CSE  /  2028</text>
