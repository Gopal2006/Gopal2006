<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gopal — I build software and like figuring out how it works</title>
  <desc id="desc">A dark graphite banner with muted crimson light, fine grid lines, and a simple circuit diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101114"/><stop offset="0.62" stop-color="#18161A"/><stop offset="1" stop-color="#0D0E11"/></linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.06" r="0.9"><stop offset="0" stop-color="#A84450" stop-opacity="0.28"/><stop offset="0.55" stop-color="#682A35" stop-opacity="0.1"/><stop offset="1" stop-color="#101114" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A84450" stop-opacity="0"/><stop offset="0.5" stop-color="#D9878D" stop-opacity="0.65"/><stop offset="1" stop-color="#A84450" stop-opacity="0"/><animate attributeName="x1" values="-1;1;-1" dur="16s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2;0" dur="16s" repeatCount="indefinite"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E9E7E5" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A84450"/><stop offset="1" stop-color="#D9878D" stop-opacity="0.15"/></linearGradient>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="358" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
