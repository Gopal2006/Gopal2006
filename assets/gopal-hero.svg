    <path d="M0 296 C180 265 330 320 500 288 S850 245 1200 282" fill="none" stroke="#A84450" stroke-opacity="0.16" stroke-width="1.2"/>
    <path d="M0 305 C180 274 330 329 500 297 S850 254 1200 291" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
    <g transform="translate(785 38)" fill="none" stroke-linecap="round">
